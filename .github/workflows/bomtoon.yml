name: Bomtoon Auto
on:
  #schedule:
    # 换算成 UTC：20点(北京04点), 01点(北京09点), 06点(北京14点), 11点(北京19点), 16点(北京00点)
    # 故意设在第 25 分钟，彻底避开整点大排队
    #- cron: '25 1,6,11,16,20 * * *'
  workflow_dispatch: # 保留手动运行按钮

jobs:
  bomtoon-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Run Bomtoon Task
        env:
          BOMTOON_USER: ${{ secrets.BOMTOON_USER }}
          BOMTOON_PASS: ${{ secrets.BOMTOON_PASS }}
          BOMTOON_COM_USER: ${{ secrets.BOMTOON_COM_USER }}
          BOMTOON_COM_PASS: ${{ secrets.BOMTOON_COM_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
