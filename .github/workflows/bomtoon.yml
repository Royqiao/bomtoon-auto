name: Bomtoon Auto
on:
  schedule:
    # 每 5 小时触发一次（UTC 0, 5, 10, 15, 20点）
    - cron: '0 */5 * * *'
  workflow_dispatch: # 支持手动触发测试

jobs:
  bomtoon-task:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          
      - name: Run Bomtoon Task
        env:
          BOMTOON_USER: ${{ secrets.BOMTOON_USER }}
          BOMTOON_PASS: ${{ secrets.BOMTOON_PASS }}
          BOMTOON_COM_USER: ${{ secrets.BOMTOON_COM_USER }}
          BOMTOON_COM_PASS: ${{ secrets.BOMTOON_COM_PASS }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASS: ${{ secrets.SENDER_PASS }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: python main.py
